<script>
  document.addEventListener("DOMContentLoaded", () => {
    const data = JSON.parse(localStorage.getItem("tiendaData") || "{}");
    const content = document.getElementById("legal-content");
    content.textContent = data.legalAcerca || "Contenido pendiente de configurar desde el panel admin.";
    const fc = document.getElementById("footer-copy");
    if (fc && data.footerCopy) fc.textContent = data.footerCopy;
    const nameEl = document.getElementById("site-name");
    if (nameEl && data.siteName) {
      const parts = data.siteName.split(" ");
      const last  = parts.pop();
      nameEl.innerHTML = parts.join(" ") + ' <span class="logo-accent">' + last + "</span>";
    }
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
      const icon = document.getElementById("theme-icon");
      if (icon) icon.className = "fas fa-sun";
    }
  });
  function toggleTheme() {
    document.body.classList.toggle("dark-mode");
    const icon = document.getElementById("theme-icon");
    if (icon) icon.className = document.body.classList.contains("dark-mode") ? "fas fa-sun" : "fas fa-moon";
    localStorage.setItem("theme", document.body.classList.contains("dark-mode") ? "dark" : "light");
  }
</script>
